<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Wagon Race 🏎</title>
    <link rel="shortcut icon" href="data:image/x-icon;" type="image/x-icon" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
<body>
  <div class="container py-4">
    <h1 class="text-center mb-4 fw-bold text-primary">Wagon Race</h1>
    <hr class="mb-4" />
    
    <div class="row text-center g-3">
      <div class="col-md-6">
        <div class="p-3 border rounded shadow-sm bg-light">
          <strong>Player 1 : </strong>
          <span class="badge bg-secondary ms-2 px-3 py-2 fs-6" id="player1-score">0</span>
        </div>
      </div>
      <div class="col-md-6">
        <div class="p-3 border rounded shadow-sm bg-light">
          <strong>Player 2 : </strong>
          <span class="badge bg-secondary ms-2 px-3 py-2 fs-6" id="player2-score">0</span>
        </div>
      </div>
    </div>
    <table class="racer-table table border border-5 border-black ms-4 w-auto mt-5">
      <tr id="player1-race">
        <td class="border border-black active"></td>
        <td class="border border-black"></td>
        <td class="border border-black"></td>
        <td class="border border-black"></td>
        <td class="border border-black"></td>
        <td class="border border-black"></td>
        <td class="border border-black"></td>
        <td class="border border-black"></td>
        <td class="border border-black"></td>
        <td class="border border-black"></td>
        <td class="border border-black"></td>
        <td class="border border-black"></td>
        <td class="border border-black"></td>
        <td class="border border-black"></td>
        <td class="border border-black"></td>
        <td class="border border-black"></td>
        <td class="border border-black"></td>
        <td class="border border-black finish"></td>
        <td class="border border-black"></td>
      </tr>
      <tr id="player2-race">
        <td class="border border-black active"></td>
        <td class="border border-black"></td>
        <td class="border border-black"></td>
        <td class="border border-black"></td>
        <td class="border border-black"></td>
        <td class="border border-black"></td>
        <td class="border border-black"></td>
        <td class="border border-black"></td>
        <td class="border border-black"></td>
        <td class="border border-black"></td>
        <td class="border border-black"></td>
        <td class="border border-black"></td>
        <td class="border border-black"></td>
        <td class="border border-black"></td>
        <td class="border border-black"></td>
        <td class="border border-black"></td>
        <td class="border border-black"></td>
        <td class="border border-black finish"></td>
        <td class="border border-black"></td>
      </tr>
    </table>
    <hr />
    <div class="d-grid gap-2 col-6 mx-auto">
      <button type="button" class="btn-outline theme-primary" disabled>Restart</button>
    </div>

    <script type="module" src="./lib/wagon_race.js"></script>
  </body>
</html>
